    <!-- JSON-LD Structured Data for Google Site Name, Publisher Organization, and Web Application -->
    <script id="json-ld-structured-data" type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TaxReview AI",
        "url": "https://tax-review-ai.vercel.app",
        "inLanguage": "en",

            "url": "https://tax-review-ai.vercel.app/android-chrome-512x512.png"

      {

        "@type": "WebApplication",
        "name": "TaxReview AI",
        "url": "https://tax-review-ai.vercel.app",

        }
      }

    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
